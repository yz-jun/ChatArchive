<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatArchive v3.4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 420px; min-height: 560px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #333; }

    .header { background: linear-gradient(135deg, #4A90D9, #357ABD); color: white; padding: 14px 20px; }
    .header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header .subtitle { font-size: 11px; opacity: 0.85; margin-top: 2px; }

    /* 主 Tab 切换 */
    .main-tabs { display: flex; background: white; border-bottom: 2px solid #e8ecf1; }
    .main-tab { flex: 1; padding: 10px 0; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .main-tab:hover { color: #4A90D9; }
    .main-tab.active { color: #4A90D9; border-bottom-color: #4A90D9; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 设置区 */
    .settings { padding: 12px 16px; background: white; border-bottom: 1px solid #e8ecf1; }
    .settings-label { font-size: 12px; font-weight: 600; color: #555; margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }

    .model-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .model-tab {
      padding: 6px 12px; border: 2px solid #ddd; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer; background: white;
      color: #666; transition: all 0.2s; white-space: nowrap;
    }
    .model-tab:hover { border-color: #4A90D9; color: #4A90D9; }
    .model-tab.active { border-color: #4A90D9; background: #4A90D9; color: white; }

    .key-row { display: flex; gap: 6px; align-items: center; }
    .key-input {
      flex: 1; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 12px; outline: none; transition: border-color 0.2s;
    }
    .key-input:focus { border-color: #4A90D9; }
    .key-btn {
      padding: 7px 10px; border: none; border-radius: 6px; font-size: 11px;
      font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .key-save { background: #4A90D9; color: white; }
    .key-save:hover { background: #357ABD; }
    .key-test { background: #e9ecef; color: #495057; }
    .key-test:hover { background: #dee2e6; }
    .key-info { font-size: 10px; color: #999; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
    .key-info a { color: #4A90D9; text-decoration: none; }
    .key-info a:hover { text-decoration: underline; }
    .key-status { font-size: 11px; margin-top: 4px; min-height: 16px; }

    /* 存储提示 */
    .storage-hint {
      padding: 6px 16px; background: #e8f8f5; border-bottom: 1px solid #e8ecf1;
      font-size: 10px; color: #1a7a6d; display: flex; align-items: center; gap: 4px;
    }

    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      padding: 12px 16px; background: white; border-bottom: 1px solid #e8ecf1;
    }
    .stat-item { text-align: center; padding: 8px; background: #f8f9fa; border-radius: 8px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #4A90D9; }
    .stat-label { font-size: 10px; color: #888; margin-top: 2px; }

    .search-bar { padding: 12px 16px; background: white; border-bottom: 1px solid #e8ecf1; }
    .search-input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
    .search-input:focus { border-color: #4A90D9; }
    .search-input::placeholder { color: #bbb; }

    .filter-tabs { display: flex; gap: 4px; padding: 8px 16px; background: white; border-bottom: 1px solid #e8ecf1; overflow-x: auto; flex-wrap: wrap; }
    .filter-tab { padding: 4px 10px; border: 1px solid #ddd; border-radius: 12px; font-size: 11px; cursor: pointer; white-space: nowrap; background: white; color: #666; transition: all 0.2s; }
    .filter-tab:hover { background: #eef3fa; border-color: #4A90D9; }
    .filter-tab.active { background: #4A90D9; color: white; border-color: #4A90D9; }

    /* 标签云 */
    .tag-cloud { padding: 8px 16px; background: white; border-bottom: 1px solid #e8ecf1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .tag-cloud-label { font-size: 10px; color: #999; margin-right: 4px; }
    .tag-chip {
      padding: 2px 8px; border-radius: 10px; font-size: 10px; cursor: pointer;
      background: #e8f4fd; color: #2980b9; border: 1px solid transparent; transition: all 0.2s;
    }
    .tag-chip:hover { border-color: #2980b9; }
    .tag-chip.active { background: #2980b9; color: white; }

    .archive-list { padding: 8px 16px; max-height: 200px; overflow-y: auto; }
    .archive-item { padding: 10px 12px; background: white; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid #4A90D9; cursor: pointer; transition: all 0.2s; position: relative; }
    .archive-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); transform: translateY(-1px); }
    .archive-item:hover .archive-del-btn { opacity: 1; }
    .archive-summary { font-size: 13px; font-weight: 500; margin-bottom: 4px; line-height: 1.4; }
    .archive-meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #999; flex-wrap: wrap; }
    .archive-tags { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
    .archive-tag { font-size: 9px; padding: 0 5px; border-radius: 8px; background: #e8f4fd; color: #2980b9; cursor: default; display: inline-flex; align-items: center; gap: 2px; }
    .archive-tag .tag-del { cursor: pointer; font-size: 10px; color: #aaa; margin-left: 1px; line-height: 1; }
    .archive-tag .tag-del:hover { color: #e74c3c; }
    .archive-tag-add { font-size: 9px; padding: 0 5px; border-radius: 8px; background: #f0f0f0; color: #999; cursor: pointer; border: 1px dashed #ccc; }
    .archive-tag-add:hover { background: #e8f4fd; color: #2980b9; border-color: #2980b9; }
    .category-badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; color: white; font-weight: 500; cursor: pointer; position: relative; }
    .category-badge:hover { opacity: 0.85; }
    .category-badge::after { content: ' ▼'; font-size: 8px; opacity: 0.6; }
    .cat-code { background: #27ae60; } .cat-write { background: #e67e22; }
    .cat-research { background: #8e44ad; } .cat-learn { background: #2980b9; }
    .cat-discuss { background: #16a085; } .cat-debug { background: #c0392b; }
    .cat-other { background: #95a5a6; }
    .archive-del-btn {
      position: absolute; top: 8px; right: 8px; background: none; border: none;
      color: #ccc; cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 4px;
      opacity: 0; transition: all 0.2s;
    }
    .archive-del-btn:hover { color: #e74c3c; background: #fde8e8; }
    .empty-state { text-align: center; padding: 30px 20px; color: #bbb; }
    .empty-state .icon { font-size: 40px; margin-bottom: 8px; }
    .empty-state .text { font-size: 13px; }

    .footer { padding: 12px 16px; background: white; border-top: 1px solid #e8ecf1; display: flex; gap: 8px; }
    .btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-export { background: #e9ecef; color: #495057; }
    .btn-export:hover { background: #dee2e6; }
    .btn-clear { background: #fde8e8; color: #c0392b; }
    .btn-clear:hover { background: #fbd5d5; }

    /* ============================================================ */
    /* TODO 面板 */
    /* ============================================================ */
    .todo-section { padding: 12px 16px; }
    .todo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .todo-header h3 { font-size: 14px; color: #333; }
    .todo-stats { font-size: 11px; color: #888; }
    .todo-input-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .todo-input {
      flex: 1; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px;
      font-size: 12px; outline: none;
    }
    .todo-input:focus { border-color: #4A90D9; }
    .todo-input::placeholder { color: #bbb; }
    .todo-add-btn {
      padding: 8px 12px; background: #4A90D9; color: white; border: none;
      border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .todo-add-btn:hover { background: #357ABD; }
    .todo-tag-input {
      width: 100%; padding: 5px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 11px; outline: none; margin-bottom: 8px;
    }
    .todo-tag-input:focus { border-color: #4A90D9; }
    .todo-tag-input::placeholder { color: #ccc; }
    .todo-priority-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
    .todo-priority-label { font-size: 11px; color: #888; }
    .priority-btn {
      padding: 3px 10px; border: 1px solid #ddd; border-radius: 12px; font-size: 10px;
      cursor: pointer; background: white; transition: all 0.2s;
    }
    .priority-btn.active-low { background: #d5f5e3; color: #27ae60; border-color: #27ae60; }
    .priority-btn.active-medium { background: #fef9e7; color: #f39c12; border-color: #f39c12; }
    .priority-btn.active-high { background: #fde8e8; color: #e74c3c; border-color: #e74c3c; }

    .todo-list { max-height: 280px; overflow-y: auto; }
    .todo-item {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
      background: white; border-radius: 8px; margin-bottom: 6px;
      border-left: 3px solid #f39c12; transition: all 0.2s;
    }
    .todo-item:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .todo-item.priority-low { border-left-color: #27ae60; }
    .todo-item.priority-medium { border-left-color: #f39c12; }
    .todo-item.priority-high { border-left-color: #e74c3c; }
    .todo-item.completed { opacity: 0.6; }
    .todo-item.completed .todo-text { text-decoration: line-through; color: #999; }
    .todo-checkbox {
      width: 18px; height: 18px; border: 2px solid #ddd; border-radius: 50%;
      cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; font-size: 11px;
    }
    .todo-checkbox:hover { border-color: #4A90D9; }
    .todo-checkbox.checked { background: #4A90D9; border-color: #4A90D9; color: white; }
    .todo-body { flex: 1; min-width: 0; }
    .todo-text { font-size: 13px; color: #333; word-break: break-word; }
    .todo-meta { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
    .todo-tag { font-size: 9px; padding: 0 5px; border-radius: 8px; background: #e8f4fd; color: #2980b9; }
    .todo-time { font-size: 10px; color: #bbb; }
    .todo-archive-link { font-size: 10px; color: #4A90D9; cursor: pointer; }
    .todo-archive-link:hover { text-decoration: underline; }
    .todo-del-btn {
      background: none; border: none; color: #ccc; cursor: pointer;
      font-size: 13px; padding: 2px; flex-shrink: 0;
    }
    .todo-del-btn:hover { color: #e74c3c; }
    .todo-footer { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e8ecf1; }
    .todo-footer .btn { font-size: 11px; padding: 6px; }

    .archive-list::-webkit-scrollbar, .todo-list::-webkit-scrollbar { width: 4px; }
    .archive-list::-webkit-scrollbar-thumb, .todo-list::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 ChatArchive</h1>
    <div class="subtitle">AI 对话工作存档助手 v3.4 — 多模型 / TODO / 标签</div>
  </div>

  <!-- 主 Tab 切换 -->
  <div class="main-tabs">
    <div class="main-tab active" data-tab="archives">📦 存档</div>
    <div class="main-tab" data-tab="todos">✅ 待办</div>
    <div class="main-tab" data-tab="settings">⚙️ 设置</div>
  </div>

  <!-- ==================== 存档 Tab ==================== -->
  <div class="tab-content active" id="tabArchives">
    <div class="storage-hint">💾 数据存储在浏览器本地，关闭浏览器不会丢失，无需登录账号</div>

    <div class="stats">
      <div class="stat-item"><div class="stat-value" id="totalArchives">0</div><div class="stat-label">总存档</div></div>
      <div class="stat-item"><div class="stat-value" id="todayArchives">0</div><div class="stat-label">今日新增</div></div>
      <div class="stat-item"><div class="stat-value" id="platformCount">0</div><div class="stat-label">覆盖平台</div></div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索存档内容、标签、平台...">
    </div>

    <div class="filter-tabs" id="filterTabs">
      <span class="filter-tab active" data-filter="all">全部</span>
      <span class="filter-tab" data-filter="代码开发">💻 代码</span>
      <span class="filter-tab" data-filter="文档写作">✍️ 文档</span>
      <span class="filter-tab" data-filter="研究分析">🔬 研究</span>
      <span class="filter-tab" data-filter="学习笔记">📚 学习</span>
      <span class="filter-tab" data-filter="方案讨论">💬 讨论</span>
      <span class="filter-tab" data-filter="问题排查">🔧 排查</span>
    </div>

    <div class="tag-cloud" id="tagCloud">
      <span class="tag-cloud-label">🏷️ 标签:</span>
      <span style="font-size:10px;color:#ccc;">加载中...</span>
    </div>

    <div class="archive-list" id="archiveList">
      <div class="empty-state"><div class="icon">📭</div><div class="text">暂无存档记录<br>在 AI 对话页面点击「保存存档点」开始</div></div>
    </div>

    <div class="footer">
      <button class="btn btn-export" id="btnExportMd">📄 导出 MD</button>
      <button class="btn btn-export" id="btnExportJson">📦 导出 JSON</button>
      <button class="btn btn-clear" id="btnClear">🗑️ 清空</button>
    </div>
  </div>

  <!-- ==================== TODO Tab ==================== -->
  <div class="tab-content" id="tabTodos">
    <div class="todo-section">
      <div class="todo-header">
        <h3>✅ 待办事项</h3>
        <span class="todo-stats" id="todoStats">0 待办 / 0 完成</span>
      </div>

      <div class="todo-input-row">
        <input type="text" class="todo-input" id="todoInput" placeholder="添加新的待办事项...">
        <button class="todo-add-btn" id="btnAddTodo">添加</button>
      </div>
      <input type="text" class="todo-tag-input" id="todoTagInput" placeholder="标签（用空格分隔，如: #前端 #紧急）">
      <div class="todo-priority-row">
        <span class="todo-priority-label">优先级:</span>
        <span class="priority-btn" data-priority="low">🟢 低</span>
        <span class="priority-btn active-medium" data-priority="medium">🟡 中</span>
        <span class="priority-btn" data-priority="high">🔴 高</span>
      </div>

      <div class="todo-list" id="todoList">
        <div class="empty-state"><div class="icon">📝</div><div class="text">暂无待办事项<br>添加待办来管理你的工作延续性</div></div>
      </div>

      <div class="todo-footer">
        <button class="btn btn-export" id="btnClearCompleted">清除已完成</button>
      </div>
    </div>
  </div>

  <!-- ==================== 设置 Tab ==================== -->
  <div class="tab-content" id="tabSettings">
    <div class="settings">
      <div class="settings-label">🤖 选择总结模型 & 填写 API Key</div>
      <div class="model-tabs" id="modelTabs"></div>
      <div class="key-row">
        <input type="password" class="key-input" id="apiKeyInput" placeholder="请输入 API Key">
        <button class="key-btn key-test" id="btnTest">测试</button>
        <button class="key-btn key-save" id="btnSave">保存</button>
      </div>
      <div class="key-status" id="keyStatus"></div>
      <div class="key-info" id="keyInfo"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
